<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Intro harness</title>
    <style>
      /* Dev-only page: the site's global.css (tokens, fonts) loads from the script, these rules lay out the tool */
      .harness {
        box-sizing: border-box;
        display: grid;
        gap: 12px;
        width: 100%;
        max-width: 1232px;
        margin: 0 auto;
        padding: 16px;
      }

      .harness header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        justify-content: space-between;
      }

      .harness h1 {
        font-size: 1.1rem;
        letter-spacing: 0;
      }

      .harness select,
      .harness button,
      .harness input[type='number'] {
        font: inherit;
        font-size: 0.85rem;
        color: inherit;
        background: transparent;
        border: 1px solid var(--line-strong, rgba(244, 241, 234, 0.36));
        border-radius: 6px;
        padding: 4px 8px;
      }

      .harness select option {
        color: #111;
      }

      /* Mirrors DeviceFrame's screen: a size container with full-bleed layers, so intros meet the same box as on the site */
      .stage {
        position: relative;
        width: 100%;
        max-width: 1200px;
        aspect-ratio: 16 / 10;
        overflow: hidden;
        container-type: inline-size;
        background: var(--bg, #1e2128);
        border-radius: 8px;
        outline: 1px solid var(--line, rgba(244, 241, 234, 0.14));
      }

      .stage > .base,
      .stage > .layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .stage > .base {
        object-fit: cover;
      }

      .stage-error {
        position: absolute;
        inset: auto 12px 12px;
        margin: 0;
        padding: 8px 12px;
        font: 0.8rem/1.4 var(--font-mono, monospace);
        background: rgba(229, 72, 77, 0.85);
        color: #fff;
        border-radius: 6px;
      }

      .controls,
      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
      }

      .controls button {
        min-width: 5.5rem;
        border-radius: 999px;
        cursor: pointer;
      }

      .controls button[aria-pressed='true'] {
        border-color: var(--accent, #e8b34d);
        background: rgba(232, 179, 77, 0.16);
      }

      .controls .scrub {
        flex: 1 1 240px;
        accent-color: var(--accent, #e8b34d);
      }

      .controls output {
        min-width: 3.6em;
        font: 600 1rem/1 var(--font-mono, monospace);
        font-variant-numeric: tabular-nums;
      }

      .options label,
      .controls label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-size: 0.85rem;
        color: var(--fg-muted, #a39e93);
      }

      .options input[type='range'] {
        width: 120px;
        accent-color: var(--accent, #e8b34d);
      }

      .controls input[type='number'] {
        width: 4.5em;
      }

      .readout {
        margin: 0;
        font: 0.8rem/1.55 var(--font-mono, monospace);
        color: var(--fg-muted, #a39e93);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .notice {
        margin: 0;
        padding: 8px 12px;
        font-size: 0.85rem;
        border: 1px solid rgba(229, 72, 77, 0.55);
        border-radius: 6px;
        background: rgba(229, 72, 77, 0.14);
      }

      .notice.info {
        border-color: rgba(94, 168, 255, 0.5);
        background: rgba(94, 168, 255, 0.12);
      }

      .keys {
        margin: 0;
        font-size: 0.75rem;
        color: var(--fg-faint, #918c82);
      }

      /* ?ui=0: the stage alone, full viewport width, for scripted screenshots */
      html[data-ui='0'] .harness {
        max-width: none;
        padding: 0;
      }

      html[data-ui='0'] .stage {
        max-width: none;
        border-radius: 0;
        outline: 0;
      }

      html[data-ui='0'] .chrome {
        display: none;
      }

      @media (max-width: 480px) {
        .harness {
          padding: 12px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./intro-harness.jsx"></script>
  </body>
</html>
